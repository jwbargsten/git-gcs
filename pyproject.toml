[project]
name = "git-remote-gcs"
version = "0.2.0"
description = "Use Google Cloud Storage as a serverless Git remote. The GCP equivalent of git-remote-s3."
authors = [{ name = "Tyler", email = "tyler@zerosumdefense.co" }]
classifiers = [
    "Topic :: Software Development :: Version Control",
    "Topic :: Software Development :: Version Control :: Git",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-cloud-storage>=2.14.0,<3.0.0",
]

[project.urls]
Homepage = "https://github.com/Vicguin65/git-remote-gcs"
Repository = "https://github.com/Vicguin65/git-remote-gcs"
Issues = "https://github.com/Vicguin65/git-remote-gcs/issues"
PyPI = "https://pypi.org/project/git-remote-gcs/"

[project.scripts]
git-remote-gcs = "git_remote_gcs.remote:main"
git-gcs = "git_remote_gcs.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "ruff",
    "pytest",
]

[tool.ruff]
line-length = 111

[tool.basedpyright]
reportUnusedCallResult = false
